[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/arthurffht/keyway"

# Versions verified on crates.io on 2026-10-21 (docs/verification-ledger.md).
[workspace.dependencies]
glib = "0.22"
gio = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
nucleo-matcher = "0.3"
unicode-normalization = "0.1"
phf = { version = "0.14", features = ["macros"] }
fend-core = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
thiserror = "2"
gettext-rs = { version = "0.8", features = ["gettext-system"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
