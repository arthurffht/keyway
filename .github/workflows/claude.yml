#
# Claude responds only to the repository owner, so strangers can neither spend the
# maintainer's quota nor inject instructions through issue text (docs/PLAN.md §31.6.5).
# It reviews and comments; it never merges, releases or changes settings.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.comment.author_association == 'OWNER'
        && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment'
        && github.event.comment.author_association == 'OWNER'
        && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review'
        && github.event.review.author_association == 'OWNER'
        && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
